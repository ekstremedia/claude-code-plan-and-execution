# Keeps the repository honest about its own rules: the scripts stay
# shellcheck-clean, the frontmatter contracts hold, and an install → doctor →
# uninstall roundtrip works on a bare checkout.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# The steps below execute repository code (install.sh, doctor.sh), so the
# checkout must not leave a usable token behind, and the job needs no write
# access to anything.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck install.sh scripts/doctor.sh templates/bin/test-example.sh

      - name: python compiles
        run: python3 -m py_compile scripts/verify-models.py scripts/lint.py

      - name: repo lint (frontmatter, JSON, doc links)
        run: python3 scripts/lint.py

      - name: install → doctor → uninstall roundtrip
        run: |
          proj="$(mktemp -d)"
          git init -q "$proj"

          ./install.sh "$proj" --templates

          # Idempotent: a second run without --force changes nothing.
          out="$(./install.sh "$proj")"
          grep -q 'Nothing changed' <<<"$out"

          # A fresh install must be doctor-clean: warnings allowed
          # (unadapted markers, no wrappers yet), failures not.
          scripts/doctor.sh "$proj"

          # Uninstall removes only what install placed: a user file dropped
          # into the templates directory survives, ours go.
          touch "$proj/.claude/plan-and-execute-templates/user-notes.md"
          ./install.sh "$proj" --uninstall --force
          test ! -e "$proj/.claude/agents/implementer.md"
          test ! -e "$proj/.claude/skills/make-plan/SKILL.md"
          test ! -e "$proj/.claude/plan-and-execute-templates/PLAN-TEMPLATE.md"
          test -e "$proj/.claude/plan-and-execute-templates/user-notes.md"

          # Uninstall keeps an adapted worker agent unless --force.
          ./install.sh "$proj"
          sed -i 's/<!-- PROJECT:.*-->/adapted/' "$proj/.claude/agents/implementer.md"
          out="$(./install.sh "$proj" --uninstall)"
          grep -q 'keep .*implementer' <<<"$out"
          test -e "$proj/.claude/agents/implementer.md"
