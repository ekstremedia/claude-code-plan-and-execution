# Keeps the repository honest about its own rules: the scripts stay
# shellcheck-clean, the frontmatter contracts hold, the transcript-reading
# scripts pass their tests, and an install → doctor → uninstall roundtrip works
# on a bare checkout.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# The steps below execute repository code (install.sh, doctor.sh), so the
# checkout must not leave a usable token behind, and the job needs no write
# access to anything.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck install.sh scripts/doctor.sh templates/bin/test-example.sh

      - name: python compiles
        run: python3 -m py_compile scripts/verify-models.py scripts/lint.py scripts/subagent-statusline.py

      - name: script tests (verify-models, subagent-statusline)
        run: python3 -m unittest discover -s tests -v

      - name: repo lint (frontmatter, JSON, doc links)
        run: python3 scripts/lint.py

      - name: install → doctor → uninstall roundtrip
        run: |
          proj="$(mktemp -d)"
          git init -q "$proj"

          ./install.sh "$proj" --templates

          # Idempotent: a second run without --force changes nothing.
          out="$(./install.sh "$proj")"
          grep -q 'Nothing changed' <<<"$out"

          # Merge the settings snippet the way the README tells a user to
          # (the // comment keys stripped). It carries the foreground switch
          # doctor asserts and the status line whose script install placed,
          # and this proves the snippet is valid settings.
          python3 - "$proj" <<'PY'
          import json, sys, pathlib
          src = json.load(open("templates/settings.snippet.json"))
          dst = pathlib.Path(sys.argv[1]) / ".claude" / "settings.json"
          dst.write_text(json.dumps({k: v for k, v in src.items() if not k.startswith("//")}, indent=2))
          PY

          # A fresh install plus the snippet must be doctor-clean: warnings
          # allowed (unadapted markers, no wrappers yet), failures not.
          out="$(scripts/doctor.sh "$proj")"
          echo "$out"

          # The workers ship without a tools: allowlist, so they reach the
          # session's MCP servers.
          grep -q 'PASS  implementer inherits' <<<"$out"
          grep -q 'PASS  quick-implementer inherits' <<<"$out"

          # The snippet's status line points at the script install placed, and
          # the script answers a tick with no workers by printing nothing.
          grep -q 'PASS  subagentStatusLine' <<<"$out"
          test -z "$(echo '{"tasks": [], "transcript_path": "/nonexistent.jsonl"}' \
            | python3 "$proj/.claude/plan-and-execute/subagent-statusline.py")"

          # The routing line counts when CLAUDE.md only imports the file that
          # holds it — a CLAUDE.md that is just "@AGENTS.md".
          grep -q 'WARN  CLAUDE.md does not mention /execute-plan' <<<"$out"
          printf '@AGENTS.md\n' > "$proj/CLAUDE.md"
          printf 'Plans run through the `/execute-plan <plan-file>` skill.\n' > "$proj/AGENTS.md"
          out="$(scripts/doctor.sh "$proj")"
          grep -q 'PASS  the routing line for saved plans is in AGENTS.md, which CLAUDE.md imports' <<<"$out"

          # The model-override check keys on _FORCE, the variable that still
          # overrides every pin; the plain one is only a warning now.
          if CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1 scripts/doctor.sh "$proj" >/dev/null; then
            echo "doctor passed with CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1 set" >&2
            exit 1
          fi
          out="$(CLAUDE_CODE_SUBAGENT_MODEL=sonnet scripts/doctor.sh "$proj")"
          grep -q 'WARN  CLAUDE_CODE_SUBAGENT_MODEL is set' <<<"$out"

          # Uninstall removes only what install placed: a user file dropped
          # into the templates directory survives, ours go.
          touch "$proj/.claude/plan-and-execute-templates/user-notes.md"
          ./install.sh "$proj" --uninstall --force
          test ! -e "$proj/.claude/agents/implementer.md"
          test ! -e "$proj/.claude/skills/make-plan/SKILL.md"
          test ! -e "$proj/.claude/plan-and-execute/subagent-statusline.py"
          test ! -e "$proj/.claude/plan-and-execute-templates/PLAN-TEMPLATE.md"
          test -e "$proj/.claude/plan-and-execute-templates/user-notes.md"

          # Uninstall keeps an adapted worker agent unless --force.
          ./install.sh "$proj"
          sed -i 's/<!-- PROJECT:.*-->/adapted/' "$proj/.claude/agents/implementer.md"
          out="$(./install.sh "$proj" --uninstall)"
          grep -q 'keep .*implementer' <<<"$out"
          test -e "$proj/.claude/agents/implementer.md"
