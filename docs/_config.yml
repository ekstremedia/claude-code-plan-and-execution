title: claude-code-plan-and-execution
description: Plan with a big model, execute with cheap ones — a two-command Claude Code workflow.

url: https://ekstremedia.github.io
baseurl: /claude-code-plan-and-execution

markdown: kramdown
highlighter: rouge

# No theme gem. docs/_layouts/default.html and docs/assets/css/style.css carry
# the whole look (Catppuccin Mocha), so nothing here depends on a remote theme
# resolving at build time.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  # Per-repo agent config written by /setup-matt-pocock-skills — machine
  # instructions, not site content. Keep the path (his skills read it there),
  # keep it off the published site.
  - agents/
